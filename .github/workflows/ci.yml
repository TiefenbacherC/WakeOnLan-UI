name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skripte prüfen
        run: |
          bash -n wol.sh pi-setup.sh
          shellcheck wol.sh pi-setup.sh

      - name: Image bauen
        run: docker build --build-arg VERSION=ci -t wakeonlan-ui:ci .

      - name: Starten
        run: |
          echo '[{"name":"Test-PC","mac":"AA:BB:CC:DD:EE:FF","ip":"127.0.0.1","broadcast":"127.0.0.1"}]' > devices.json
          docker run -d --name wol --network host -e PORT=8090 \
            -v "$PWD/devices.json:/config/devices.json:ro" wakeonlan-ui:ci
          for i in $(seq 30); do curl -fs localhost:8090/ >/dev/null && break; sleep 1; done

      - name: Seite und Aufwecken testen
        run: |
          curl -fs localhost:8090/ | tee page.html | grep -q 'Test-PC'
          grep -q 'online' page.html
          curl -fs -d id=0 localhost:8090/wake | grep -q 'Magic Packet an Test-PC gesendet'
          test "$(curl -s -o /dev/null -w '%{http_code}' -d id=5 localhost:8090/wake)" = 400

      - name: Logs
        if: always()
        run: docker logs wol
